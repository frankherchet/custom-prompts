<!doctype html>
<html lang="en" data-theme="premium-light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>[TITLE]</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root,
      :root[data-theme="premium-light"] {
        color-scheme: light;
        --font-body: "Manrope", sans-serif;
        --font-display: "Manrope", sans-serif;
        --font-mono: "IBM Plex Mono", monospace;
        --bg: #eef2f6;
        --bg-a: rgba(28, 105, 212, 0.12);
        --bg-b: rgba(143, 168, 195, 0.18);
        --bg-c: rgba(255, 255, 255, 0.42);
        --ink: #0d1117;
        --muted: #4e5b67;
        --line: rgba(13, 17, 23, 0.1);
        --grid-line: rgba(13, 17, 23, 0.022);
        --card: rgba(255, 255, 255, 0.84);
        --card-strong: rgba(255, 255, 255, 0.94);
        --panel-glow-a: rgba(28, 105, 212, 0.12);
        --panel-glow-b: rgba(143, 168, 195, 0.16);
        --accent: #1c69d4;
        --accent-soft: #8fa8c3;
        --shadow: 0 22px 70px rgba(17, 35, 59, 0.08);
        --radius: 24px;
        --terminal-bg: linear-gradient(180deg, #10151c, #151b22);
        --terminal-ink: #edf1f3;
        --terminal-accent: #85b8ff;
        --terminal-warn: #d1d9e0;
        --switch-bg: rgba(255, 255, 255, 0.78);
        --switch-border: rgba(13, 17, 23, 0.1);
      }

      :root[data-theme="oeh-dark"] {
        color-scheme: dark;
        --font-body: "Space Grotesk", sans-serif;
        --font-display: "Space Grotesk", sans-serif;
        --font-mono: "IBM Plex Mono", monospace;
        --bg: #06090d;
        --bg-a: rgba(53, 201, 180, 0.11);
        --bg-b: rgba(17, 71, 161, 0.2);
        --bg-c: rgba(255, 255, 255, 0.02);
        --ink: #f4f7fb;
        --muted: #97a6b8;
        --line: rgba(151, 166, 184, 0.16);
        --grid-line: rgba(151, 166, 184, 0.06);
        --card: rgba(10, 15, 21, 0.82);
        --card-strong: rgba(13, 19, 27, 0.94);
        --panel-glow-a: rgba(53, 201, 180, 0.14);
        --panel-glow-b: rgba(17, 71, 161, 0.18);
        --accent: #35c9b4;
        --accent-soft: #3f7fe0;
        --shadow: 0 28px 90px rgba(0, 0, 0, 0.42);
        --radius: 20px;
        --terminal-bg: linear-gradient(180deg, #071116, #0b151d);
        --terminal-ink: #e7f4f3;
        --terminal-accent: #72f2df;
        --terminal-warn: #92a5bf;
        --switch-bg: rgba(9, 14, 19, 0.88);
        --switch-border: rgba(151, 166, 184, 0.16);
      }

      :root[data-theme="editorial-beige"] {
        color-scheme: light;
        --font-body: "Newsreader", serif;
        --font-display: "Newsreader", serif;
        --font-mono: "IBM Plex Mono", monospace;
        --bg: #ece4d7;
        --bg-a: rgba(173, 116, 74, 0.11);
        --bg-b: rgba(129, 109, 84, 0.14);
        --bg-c: rgba(255, 248, 238, 0.38);
        --ink: #281d17;
        --muted: #6d5d52;
        --line: rgba(40, 29, 23, 0.12);
        --grid-line: rgba(40, 29, 23, 0.03);
        --card: rgba(255, 248, 238, 0.84);
        --card-strong: rgba(255, 250, 243, 0.94);
        --panel-glow-a: rgba(173, 116, 74, 0.12);
        --panel-glow-b: rgba(129, 109, 84, 0.14);
        --accent: #ad744a;
        --accent-soft: #816d54;
        --shadow: 0 18px 55px rgba(88, 63, 42, 0.12);
        --radius: 22px;
        --terminal-bg: linear-gradient(180deg, #2a241f, #342d27);
        --terminal-ink: #f5efe7;
        --terminal-accent: #f1bf93;
        --terminal-warn: #d8c6b4;
        --switch-bg: rgba(255, 248, 238, 0.8);
        --switch-border: rgba(40, 29, 23, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at 15% 15%, var(--bg-a), transparent 22%),
          radial-gradient(circle at 88% 12%, var(--bg-b), transparent 24%),
          linear-gradient(180deg, var(--bg-c), transparent 20%),
          var(--bg);
        color: var(--ink);
        font-family: var(--font-body);
      }

      body {
        overflow: hidden;
      }

      .deck {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      .slide {
        position: absolute;
        inset: 0;
        padding: 40px;
        opacity: 0;
        transform: translateX(24px) scale(0.99);
        transition:
          opacity 280ms ease,
          transform 420ms cubic-bezier(0.2, 0.9, 0.2, 1);
        pointer-events: none;
      }

      .slide.active {
        opacity: 1;
        transform: translateX(0) scale(1);
        pointer-events: auto;
      }

      .panel {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 32px 36px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background:
          linear-gradient(var(--grid-line) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
          var(--card);
        background-size: 32px 32px, 32px 32px, auto;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .panel::before,
      .panel::after {
        content: "";
        position: absolute;
        border-radius: 999px;
        filter: blur(4px);
        pointer-events: none;
      }

      .panel::before {
        top: -72px;
        right: -72px;
        width: 220px;
        height: 220px;
        background: radial-gradient(circle, var(--panel-glow-a), transparent 70%);
      }

      .panel::after {
        bottom: -90px;
        left: -80px;
        width: 260px;
        height: 260px;
        background: radial-gradient(circle, var(--panel-glow-b), transparent 70%);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card-strong);
        color: var(--muted);
        font: 500 12px/1 var(--font-mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--accent);
      }

      .title {
        margin: 18px 0 0;
        max-width: 11em;
        font-family: var(--font-display);
        font-size: clamp(40px, 5vw, 72px);
        line-height: 0.94;
        letter-spacing: -0.05em;
      }

      .subtitle,
      .body,
      .body li {
        color: var(--muted);
        font-size: clamp(17px, 1.8vw, 22px);
        line-height: 1.48;
      }

      .subtitle {
        max-width: 880px;
        margin-top: 14px;
      }

      .grid-2,
      .grid-4 {
        display: grid;
        gap: 16px;
        margin-top: 22px;
      }

      .grid-2 {
        grid-template-columns: 1.1fr 0.9fr;
      }

      .grid-4 {
        grid-template-columns: repeat(4, 1fr);
      }

      .card,
      .terminal,
      .quote,
      .result {
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 16px;
      }

      .card,
      .quote,
      .result {
        background: var(--card-strong);
      }

      .card strong,
      .result strong {
        display: block;
        margin-bottom: 8px;
        font-size: 16px;
      }

      .terminal {
        background: var(--terminal-bg);
        color: var(--terminal-ink);
        font-family: var(--font-mono);
        font-size: 14px;
        line-height: 1.6;
        white-space: pre-wrap;
      }

      .terminal .accent {
        color: var(--terminal-accent);
      }

      .terminal .warn {
        color: var(--terminal-warn);
      }

      .arrow {
        margin-top: 18px;
        color: var(--accent);
        font-family: var(--font-mono);
        font-size: 15px;
        font-weight: 600;
      }

      .chrome {
        position: absolute;
        right: 36px;
        bottom: 24px;
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .slide-index {
        color: var(--muted);
        font: 500 12px/1 var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .progress {
        width: 100px;
        height: 2px;
        background: color-mix(in srgb, var(--ink) 12%, transparent);
      }

      .progress > span {
        display: block;
        height: 100%;
        width: 50%;
        background: linear-gradient(90deg, var(--accent), var(--accent-soft));
      }

      .theme-control {
        position: fixed;
        top: 18px;
        right: 18px;
        z-index: 30;
      }

      .theme-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border: 1px solid var(--switch-border);
        border-radius: 999px;
        background: var(--switch-bg);
        color: var(--ink);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        backdrop-filter: blur(8px);
        cursor: pointer;
      }

      .theme-toggle svg {
        width: 18px;
        height: 18px;
      }

      .theme-menu {
        display: none;
        width: 220px;
        margin-top: 10px;
        padding: 10px;
        border: 1px solid var(--switch-border);
        border-radius: 16px;
        background: var(--switch-bg);
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
      }

      .theme-control[data-open="true"] .theme-menu {
        display: grid;
        gap: 8px;
      }

      .theme-option {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 10px;
        align-items: center;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid transparent;
        border-radius: 12px;
        background: transparent;
        color: var(--ink);
        text-align: left;
        cursor: pointer;
      }

      .theme-option[aria-pressed="true"] {
        border-color: var(--line);
        background: color-mix(in srgb, var(--card-strong) 88%, transparent);
      }

      .theme-swatch {
        display: inline-flex;
        gap: 3px;
      }

      .theme-swatch span {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        border: 1px solid rgba(0, 0, 0, 0.08);
      }

      .theme-meta {
        display: grid;
        gap: 2px;
      }

      .theme-name {
        font-size: 13px;
        font-weight: 700;
      }

      .theme-note {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.3;
      }

      .theme-check {
        color: var(--accent);
        font: 700 12px/1 var(--font-mono);
      }

      @media (max-width: 980px) {
        .slide {
          padding: 18px;
        }

        .panel {
          padding: 24px 24px 50px;
        }

        .grid-2,
        .grid-4 {
          grid-template-columns: 1fr;
        }

        .theme-control {
          top: 12px;
          right: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="theme-control" data-open="false">
      <button
        class="theme-toggle"
        type="button"
        aria-label="Switch presentation theme"
        aria-expanded="false"
        data-theme-toggle
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5A8.5 8.5 0 0 1 12 3.5Z"></path>
          <circle cx="8" cy="10" r="1.2" fill="currentColor" stroke="none"></circle>
          <circle cx="11" cy="7.5" r="1.2" fill="currentColor" stroke="none"></circle>
          <circle cx="15" cy="8.5" r="1.2" fill="currentColor" stroke="none"></circle>
        </svg>
      </button>
      <div class="theme-menu" role="menu" aria-label="Theme options" data-theme-menu>
        <button class="theme-option" type="button" data-theme-option="premium-light" aria-pressed="true">
          <span class="theme-swatch" aria-hidden="true">
            <span style="background:#eef2f6"></span>
            <span style="background:#1c69d4"></span>
            <span style="background:#8fa8c3"></span>
          </span>
          <span class="theme-meta">
            <span class="theme-name">Premium Light</span>
            <span class="theme-note">cool, boardroom, BMW-adjacent</span>
          </span>
          <span class="theme-check">on</span>
        </button>
        <button class="theme-option" type="button" data-theme-option="oeh-dark" aria-pressed="false">
          <span class="theme-swatch" aria-hidden="true">
            <span style="background:#06090d"></span>
            <span style="background:#35c9b4"></span>
            <span style="background:#3f7fe0"></span>
          </span>
          <span class="theme-meta">
            <span class="theme-name">OEH Dark</span>
            <span class="theme-note">technical, dense, manifesto-like</span>
          </span>
          <span class="theme-check"></span>
        </button>
        <button class="theme-option" type="button" data-theme-option="editorial-beige" aria-pressed="false">
          <span class="theme-swatch" aria-hidden="true">
            <span style="background:#ece4d7"></span>
            <span style="background:#ad744a"></span>
            <span style="background:#816d54"></span>
          </span>
          <span class="theme-meta">
            <span class="theme-name">Editorial Beige</span>
            <span class="theme-note">warm, quieter, essay-like</span>
          </span>
          <span class="theme-check"></span>
        </button>
      </div>
    </div>

    <main class="deck" aria-label="Presentation deck">
      <section class="slide active">
        <div class="panel">
          <div class="eyebrow">[EYEBROW]</div>
          <h1 class="title">[TITLE SLIDE THESIS]</h1>
          <p class="subtitle">[SHORT SUPPORTING EXPLANATION]</p>
          <div class="grid-2">
            <div class="card">[LEFT BLOCK]</div>
            <div class="terminal">[RIGHT BLOCK / TERMINAL / SYSTEM VIEW]</div>
          </div>
          <div class="chrome">
            <div class="progress"><span></span></div>
            <div class="slide-index">[01 / NN]</div>
          </div>
        </div>
      </section>
    </main>

    <script>
      const THEME_STORAGE_KEY = "html-presentation-deck-theme";
      const root = document.documentElement;
      const themeControl = document.querySelector("[data-open]");
      const themeToggle = document.querySelector("[data-theme-toggle]");
      const themeMenu = document.querySelector("[data-theme-menu]");
      const themeOptions = Array.from(document.querySelectorAll("[data-theme-option]"));

      function setTheme(theme) {
        root.dataset.theme = theme;
        try {
          localStorage.setItem(THEME_STORAGE_KEY, theme);
        } catch (error) {
          console.warn("Theme preference could not be saved.", error);
        }
        themeOptions.forEach((option) => {
          const active = option.dataset.themeOption === theme;
          option.setAttribute("aria-pressed", String(active));
          option.querySelector(".theme-check").textContent = active ? "on" : "";
        });
      }

      function openThemeMenu(force) {
        const open = typeof force === "boolean" ? force : themeControl.dataset.open !== "true";
        themeControl.dataset.open = String(open);
        themeToggle.setAttribute("aria-expanded", String(open));
      }

      themeToggle.addEventListener("click", () => {
        openThemeMenu();
      });

      themeOptions.forEach((option) => {
        option.addEventListener("click", () => {
          setTheme(option.dataset.themeOption);
          openThemeMenu(false);
        });
      });

      document.addEventListener("click", (event) => {
        if (!themeControl.contains(event.target)) {
          openThemeMenu(false);
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          openThemeMenu(false);
        }
      });

      try {
        const storedTheme = localStorage.getItem(THEME_STORAGE_KEY);
        if (storedTheme) {
          setTheme(storedTheme);
        } else {
          setTheme(root.dataset.theme || "premium-light");
        }
      } catch (error) {
        setTheme(root.dataset.theme || "premium-light");
      }
    </script>
  </body>
</html>
